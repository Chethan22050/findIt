[build]
  # Install dependencies as part of the build so it works even when the
  # environment hasn't run an install step first (otherwise: "vite: not found").
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"

# Single-page app: serve index.html for client-side routes (react-router).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
